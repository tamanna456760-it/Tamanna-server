name: Deploy Tamanna API to VPS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tamanna-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Run VPS setup script and deploy server, website, and AI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate deployment secrets and prepare SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Add VPS_HOST in repository Actions secrets}"
          : "${VPS_USER:?Add VPS_USER in repository Actions secrets}"
          : "${VPS_SSH_KEY:?Add VPS_SSH_KEY in repository Actions secrets}"
          : "${VPS_KNOWN_HOSTS:?Add VPS_KNOWN_HOSTS in repository Actions secrets}"
          VPS_SSH_PORT="${VPS_SSH_PORT:-22}"
          if ! [[ "${VPS_SSH_PORT}" =~ ^[0-9]+$ ]] || (( VPS_SSH_PORT < 1 || VPS_SSH_PORT > 65535 )); then
            echo "VPS_SSH_PORT must be a valid TCP port." >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/tamanna_deploy"
          chmod 600 "$HOME/.ssh/tamanna_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            echo "VPS_HOST=$VPS_HOST"
            echo "VPS_USER=$VPS_USER"
            echo "VPS_SSH_PORT=$VPS_SSH_PORT"
          } >> "$GITHUB_ENV"

      - name: SSH to Ubuntu VPS and run deploy/vps-setup.sh
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_SSH_PORT" -i "$HOME/.ssh/tamanna_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          if [[ -r /etc/os-release ]]; then
            . /etc/os-release
          else
            echo "Cannot identify remote operating system." >&2
            exit 1
          fi
          if [[ "${ID:-}" != "ubuntu" ]]; then
            echo "This setup script supports Ubuntu VPS only; detected: ${PRETTY_NAME:-unknown}" >&2
            exit 1
          fi
          if ! command -v sudo >/dev/null 2>&1; then
            echo "sudo is required for the SSH user." >&2
            exit 1
          fi
          sudo -n true 2>/dev/null || {
            echo "The VPS SSH user must have passwordless sudo for unattended GitHub Actions." >&2
            exit 1
          }
          sudo apt-get update
          sudo apt-get install -y git ca-certificates
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          git clone --branch main --depth 1 https://github.com/tamanna456760-it/Tamanna-server.git "$TMP_DIR/Tamanna-server"
          test -f "$TMP_DIR/Tamanna-server/deploy/vps-setup.sh"
          sudo bash "$TMP_DIR/Tamanna-server/deploy/vps-setup.sh"
          cd /var/www/tamanna
          docker compose --profile ai ps
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8001/health
          echo "Tamanna VPS setup and deployment completed; both health checks passed."
          REMOTE
