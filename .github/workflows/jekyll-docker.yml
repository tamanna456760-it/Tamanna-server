name: Tamanna server CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Audit dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.txt

      - name: Validate domain configuration
        run: python scripts/validate_domains.py

      - name: Compile Python
        run: python -m compileall -q app.py scripts tests

      - name: Run application tests
        env:
          ORCHESTRATOR_TOKEN: ci-only-token-not-for-production
          DATABASE_URL: sqlite://
        run: python -m unittest discover -v

      - name: Configure CI-only environment
        run: |
          printf 'ORCHESTRATOR_TOKEN=ci-only-token-not-for-production\n' > .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build container image
        run: docker build --tag tamanna-server-ci .
