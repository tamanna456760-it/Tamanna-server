# This repository is a Python/Flask server, not a Jekyll site.
# Keep the legacy build available for manual diagnostics only; server-ci.yml
# is the authoritative CI workflow for pushes and pull requests.
name: Legacy Jekyll site CI (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-build:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled legacy build
        run: echo "Jekyll CI is disabled for this Python server repository. See Tamanna Server CI."
