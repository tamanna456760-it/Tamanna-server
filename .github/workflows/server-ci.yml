name: Tamanna Server CI

on:
  push:
    branches:
      - main
      - "security/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q app.py server.py tests
      - name: Run server tests
        env:
          ORCHESTRATOR_TOKEN: ci-test-token
          DATABASE_URL: sqlite://
        run: pytest -q
