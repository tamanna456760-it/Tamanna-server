name: Tamanna Server CI

on:
  push:
    branches:
      - main
      - "security/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff pip-audit

      - name: Compile server code
        run: python -m compileall -q app.py server.py tests scripts

      - name: Lint server code
        run: ruff check --select E4,E7,E9,F app.py server.py tests scripts

      - name: Validate tracked JSON files
        run: python scripts/validate_json.py

      - name: Validate domain configuration
        run: python scripts/validate_domains.py

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run API tests
        env:
          ORCHESTRATOR_TOKEN: ci-test-token
          DATABASE_URL: sqlite://
          CORS_ORIGINS: https://www.tamanna.com
        run: pytest -q

      - name: Build production container
        run: docker build --pull -f dockerfile -t tamanna-server-ci .

      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f tamanna-server-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name tamanna-server-ci \
            -p 127.0.0.1:18000:8000 \
            -e ORCHESTRATOR_TOKEN=ci-test-token \
            -e DATABASE_URL=sqlite:////app/data/ci.db \
            tamanna-server-ci
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          curl --fail http://127.0.0.1:18000/health/ready
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:18000/api/report \
            -H 'Authorization: Bearer ci-test-token' \
            -H 'Content-Type: application/json' \
            -d '{"agent_id":"ci-smoke","branch":"main"}'
