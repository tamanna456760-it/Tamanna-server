name: Tamanna Server CI

on:
  push:
    branches:
      - main
      - "security/**"
      - "domain/**"
      - "infra/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout server and pinned Tamanna AI source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify pinned Tamanna AI source
        run: |
          test -f vendor/tamanna-ai/Main.py
          test -f vendor/tamanna-ai/requirements-server.txt
          python -m compileall -q vendor/tamanna-ai/tamanna_ai
      - name: Compile server code
        run: python -m compileall -q app.py server.py agent.py apps.py synce.py monitoring.py auto_sync.py cloud_auto_sync.py tamanna_bd-king-r7_sunc.py tamanna_powerhub_pipeline.py security tests scripts
      - name: Lint server code
        run: ruff check --select E4,E7,E9,F app.py server.py agent.py apps.py synce.py tests scripts
      - name: Validate tracked JSON files
        run: python scripts/validate_json.py
      - name: Validate domain configuration
        run: python scripts/validate_domains.py
      - name: Validate private home DNS templates
        run: python scripts/validate_home_dns.py
      - name: Scan tracked files for hard-coded secrets
        run: python scripts/scan_secrets.py
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Run API tests
        env:
          ORCHESTRATOR_TOKEN: tamanna-ci-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          DATABASE_URL: sqlite://
          CORS_ORIGINS: https://www.bd-king-r7.com
        run: python -m pytest -q tests
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          ORCHESTRATOR_TOKEN=tamanna-ci-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx docker compose config --quiet
      - name: Build production container
        run: docker build --pull -f dockerfile -t tamanna-server-ci .
      - name: Build Tamanna AI container
        run: docker build --pull -f deploy/tamanna-ai/Dockerfile -t tamanna-ai-ci .
      - name: Runtime smoke test Tamanna AI container
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f tamanna-ai-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name tamanna-ai-smoke \
            -p 127.0.0.1:8001:8000 \
            -e TAMANNA_ENV=test \
            -e TAMANNA_MODEL_PROVIDER=mock \
            -e TAMANNA_SESSION_SECRET=ci-only-test-secret-not-for-production-0123456789 \
            -e TAMANNA_ADMIN_EMAIL=ci-admin@example.invalid \
            -e TAMANNA_AUTH_DB=/app/data/ci-accounts.sqlite3 \
            -e TAMANNA_DATABASE_URL=sqlite:////app/data/ci-tamanna.sqlite3 \
            -e TAMANNA_CORS_ORIGINS=https://www.bd-king-r7.com \
            -e TAMANNA_COOKIE_SECURE=0 \
            tamanna-ai-ci
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/health >/tmp/tamanna-ai-health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          python -c "import json; d=json.load(open('/tmp/tamanna-ai-health.json')); assert d.get('status') == 'ok', d"
          curl --fail --silent http://127.0.0.1:8001/api/status | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('status') == 'online', d"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8001/api/admin/overview)" = "401"
          cookie_jar="$(mktemp)"
          trap 'docker rm -f tamanna-ai-smoke >/dev/null 2>&1 || true; rm -f "$cookie_jar"' EXIT
          origin_args=(-H "Origin: https://www.bd-king-r7.com" -H "Content-Type: application/json")
          curl --fail --silent --show-error -c "$cookie_jar" -b "$cookie_jar" \
            "${origin_args[@]}" -X POST http://127.0.0.1:8001/api/auth/signup \
            --data '{"email":"ci-admin@example.invalid","name":"CI Admin","password":"ci-test-password-strong-123"}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['user']['email']=='ci-admin@example.invalid', d"
          curl --fail --silent --show-error -c "$cookie_jar" -b "$cookie_jar" \
            http://127.0.0.1:8001/api/auth/me \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['user']['email']=='ci-admin@example.invalid', d"
          curl --fail --silent --show-error -c "$cookie_jar" -b "$cookie_jar" \
            http://127.0.0.1:8001/api/admin/overview \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['admin']['email']=='ci-admin@example.invalid', d"
          curl --fail --silent --show-error -c "$cookie_jar" -b "$cookie_jar" \
            "${origin_args[@]}" -X POST http://127.0.0.1:8001/api/auth/logout \
            --data '{}' | python -c "import json,sys; assert json.load(sys.stdin)['ok']"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -b "$cookie_jar" http://127.0.0.1:8001/api/auth/me)" = "401"
          curl --fail --silent --show-error -c "$cookie_jar" -b "$cookie_jar" \
            "${origin_args[@]}" -X POST http://127.0.0.1:8001/api/auth/login \
            --data '{"email":"ci-admin@example.invalid","password":"ci-test-password-strong-123"}' \
            | python -c "import json,sys; assert json.load(sys.stdin)['ok']"
          curl --fail --silent --show-error -c "$cookie_jar" -b "$cookie_jar" \
            "${origin_args[@]}" -X POST http://127.0.0.1:8001/api/chat \
            --data '{"message":"Reply with a short greeting."}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['source']=='mock' and d['reply']=='Mock response: Reply with a short greeting.', d"
          curl --fail --silent --show-error -b "$cookie_jar" \
            http://127.0.0.1:8001/api/history \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['history'] and d['history'][-1]['user']=='Reply with a short greeting.', d"
          echo "PASS: Tamanna AI startup, health, status, signup, session, admin authorization, logout, login, mock chat generation, and SQLite chat history"
      - name: Build Tor sidecar image
        run: docker build --pull -f deploy/tor/Dockerfile -t tamanna-server-tor-ci .
      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f tamanna-server-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name tamanna-server-ci \
            -p 127.0.0.1:18000:8000 \
            -e ORCHESTRATOR_TOKEN=tamanna-ci-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
            -e DATABASE_URL=sqlite:////app/data/ci.db \
            tamanna-server-ci
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          curl --fail http://127.0.0.1:18000/health/ready
          curl --fail --silent --show-error -X POST http://127.0.0.1:18000/api/report \
            -H 'Authorization: Bearer tamanna-ci-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
            -H 'Content-Type: application/json' -d '{"agent_id":"ci-smoke","branch":"main"}'

  website-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check website server
        run: node --check server.js && node --check server_main.js && node --check underground.js && node --check ai-github-bot.js
      - name: Test static website server
        run: npm test

  dotnet-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore .NET project
        run: dotnet restore bd-king-orchestrator.csproj
      - name: Build .NET project
        run: dotnet build bd-king-orchestrator.csproj --configuration Release --no-restore
