name: Audit all Shell Scripts and Deploy Tamanna
on:
  workflow_dispatch:
    inputs:
      run_vps_setup:
        description: "Run deploy/vps-setup.sh on the Ubuntu VPS"
        required: true
        type: boolean
        default: false
      run_tls_setup:
        description: "Run deploy/enable-tls.sh only after DNS points to this VPS"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tamanna-shell-maintenance
  cancel-in-progress: false

jobs:
  shell-audit:
    name: Find and syntax-check every .sh file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tamanna-server
        uses: actions/checkout@v4
        with:
          repository: tamanna456760-it/Tamanna-server
          ref: main
          path: Tamanna-server
      - name: Checkout Tamanna AI
        uses: actions/checkout@v4
        with:
          repository: tamanna456760-it/Tamanna-
          ref: main
          path: Tamanna-
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Syntax-check all shell scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          count=0
          failed=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            echo "::group::Checking $file"
            if bash -n "$file"; then
              echo "PASS bash -n: $file"
            else
              echo "FAIL bash -n: $file"
              failed=$((failed + 1))
            fi
            shellcheck -S warning "$file" || echo "ShellCheck warnings: $file"
            echo "::endgroup::"
          done < <(find Tamanna-server Tamanna- -type f -name '*.sh' -not -path '*/.git/*' -print0)
          echo "Shell scripts found: $count"
          echo "Syntax failures: $failed"
          test "$count" -gt 0
          test "$failed" -eq 0

  vps-deploy:
    name: Run the supported VPS setup script
    needs: shell-audit
    if: \${{ inputs.run_vps_setup }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Validate SSH secrets
        shell: bash
        env:
          VPS_HOST: \${{ secrets.VPS_HOST }}
          VPS_USER: \${{ secrets.VPS_USER }}
          VPS_SSH_PORT: \${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: \${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: \${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          VPS_SSH_PORT="\${VPS_SSH_PORT:-22}"
          [[ "$VPS_SSH_PORT" =~ ^[0-9]+$ ]] && (( VPS_SSH_PORT >= 1 && VPS_SSH_PORT <= 65535 ))
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/tamanna_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tamanna_deploy" "$HOME/.ssh/known_hosts"
          echo "VPS_SSH_PORT=$VPS_SSH_PORT" >> "$GITHUB_ENV"
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "VPS_USER=$VPS_USER" >> "$GITHUB_ENV"
      - name: SSH and run deploy/vps-setup.sh
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_SSH_PORT" -i "$HOME/.ssh/tamanna_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          . /etc/os-release
          test "$ID" = ubuntu || { echo "Ubuntu VPS required" >&2; exit 1; }
          sudo -n true || { echo "SSH user needs passwordless sudo" >&2; exit 1; }
          sudo apt-get update
          sudo apt-get install -y git ca-certificates
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone --depth 1 --branch main https://github.com/tamanna456760-it/Tamanna-server.git "$tmp/Tamanna-server"
          test -s "$tmp/Tamanna-server/deploy/vps-setup.sh"
          sudo bash "$tmp/Tamanna-server/deploy/vps-setup.sh"
          cd /var/www/tamanna
          sudo docker compose --profile ai ps
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8001/health
          REMOTE

  tls-deploy:
    name: Enable HTTPS after DNS preconditions are met
    needs: vps-deploy
    if: \${{ inputs.run_vps_setup && inputs.run_tls_setup }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate SSH secrets
        shell: bash
        env:
          VPS_HOST: \${{ secrets.VPS_HOST }}
          VPS_USER: \${{ secrets.VPS_USER }}
          VPS_SSH_PORT: \${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: \${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: \${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          VPS_SSH_PORT="\${VPS_SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/tamanna_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tamanna_deploy" "$HOME/.ssh/known_hosts"
          echo "VPS_SSH_PORT=$VPS_SSH_PORT" >> "$GITHUB_ENV"
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "VPS_USER=$VPS_USER" >> "$GITHUB_ENV"
      - name: Run deploy/enable-tls.sh
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$VPS_SSH_PORT" -i "$HOME/.ssh/tamanna_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" 'sudo bash /var/www/tamanna/deploy/enable-tls.sh'
