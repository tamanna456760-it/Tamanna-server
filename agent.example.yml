# Copy to /etc/bdking/agent.yml and edit for a trusted local repository.
# Store ORCHESTRATOR_TOKEN in the agent process environment, never in this YAML.
repo_path: /home/youruser/projects/Tamanna-server
branch: powerhub-auto
remote: origin
interval_seconds: 300
push_changes: false
fix_cmds: []
build_cmds:
  - "python -m compileall -q app.py server.py agent.py tests scripts"
  - "python scripts/validate_json.py"
  - "python scripts/validate_domains.py"
  - "python -m pytest -q"
ficar: ficar
power_sync: power_sync
lockfile: /var/lock/bd-king-r7-powerhub.lock
logfile: /var/log/bd-king-r7-powerhub.log
agent_id: tamanna-agent-local
server_url: ""
