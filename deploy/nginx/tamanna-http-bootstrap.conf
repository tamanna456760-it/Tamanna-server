# Temporary HTTP-only bootstrap configuration for Let's Encrypt HTTP-01.
# Replace this with tamanna-domains.conf after the SAN certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name tamanna.com www.tamanna.com tamanna.io www.tamanna.io api.tamanna.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 200 "Tamanna domain validation endpoint. HTTPS setup pending.\n";
    }
}
