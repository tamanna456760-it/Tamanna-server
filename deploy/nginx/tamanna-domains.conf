
server {
    listen 80;
    server_name tamanna.com www.tamanna.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.tamanna.com$request_uri;
    }
}

server {
    listen 80;
    server_name tamanna.io www.tamanna.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.tamanna.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.tamanna.com tamanna.com;

    # Configure certificate paths after issuing TLS certificates.
    # ssl_certificate /etc/letsencrypt/live/www.tamanna.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.tamanna.com/privkey.pem;

    root /var/www/tamanna;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
