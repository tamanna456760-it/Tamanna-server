# Production Nginx virtual hosts for Tamanna.
# Issue certificates for both domains before enabling this file:
# certbot certonly --webroot -w /var/www/html -d tamanna.com -d www.tamanna.com
# certbot certonly --webroot -w /var/www/html -d tamanna.io -d www.tamanna.io

server {
    listen 80;
    listen [::]:80;
    server_name tamanna.com www.tamanna.com tamanna.io www.tamanna.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://www.tamanna.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tamanna.com;

    ssl_certificate /etc/letsencrypt/live/tamanna.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tamanna.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.tamanna.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tamanna.com;

    ssl_certificate /etc/letsencrypt/live/tamanna.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tamanna.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/tamanna/Wabsite;
    index Index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    server_tokens off;
    client_max_body_size 1m;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /Index.html;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tamanna.io www.tamanna.io;

    ssl_certificate /etc/letsencrypt/live/tamanna.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tamanna.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.tamanna.com$request_uri;
}
