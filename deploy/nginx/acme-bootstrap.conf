# Temporary HTTP-only virtual host used to issue Let's Encrypt certificates.
# Install this first, issue both certificates, then enable tamanna-domains.conf.
server {
    listen 80;
    listen [::]:80;
    server_name tamanna.com www.tamanna.com tamanna.io www.tamanna.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 200 "Tamanna TLS bootstrap is ready";
        add_header Content-Type text/plain;
    }
}
