# Temporary HTTP-only vhost for ACME validation of the new primary domain.
server {
    listen 80;
    listen [::]:80;
    server_name bd-king-r7.com www.bd-king-r7.com;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        return 200 "Tamanna TLS bootstrap is ready";
        add_header Content-Type text/plain;
    }
}
