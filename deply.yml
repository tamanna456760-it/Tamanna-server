# INACTIVE DEPLOYMENT TEMPLATE.
# This file is at repository root, so GitHub Actions does not execute it.
# Move it into .github/workflows only after configuring a staging environment,
# reviewing remote paths, and approving a deployment procedure.
name: Manual Tamanna Server Deployment Template

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"

      - name: Explain required manual deployment review
        run: |
          echo "Deployment is intentionally not automated by this template."
          echo "Review host, target directory, backup, health check and rollback before adding a deploy action."
