services:
orchestrator:
build:
context: .
dockerfile: Dockerfile

container_name: tamanna-ai-orchestrator
restart: unless-stopped
ports:
  - "127.0.0.1:8000:8000"
env_file:
  - .env
environment:
  APP_NAME: "Tamanna AI"
  APP_ENV: "${APP_ENV:-production}"
  HOST: "0.0.0.0"
  PORT: "8000"
  ORCHESTRATOR_TOKEN: "${ORCHESTRATOR_TOKEN:?Set ORCHESTRATOR_TOKEN in .env}"
  DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/reports.db}"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
volumes:
  - ./data:/app/data
healthcheck:
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 20s
init: true
security_opt:
  - no-new-privileges:true
stop_grace_period: 30s
logging:
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
networks:
  - tamanna-internal

networks:
tamanna-internal:
driver: bridge