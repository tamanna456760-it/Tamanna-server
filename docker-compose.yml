services:
  orchestrator:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tamanna-central-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_NAME: "Tamanna Central Server"
      APP_ENV: "${APP_ENV:-production}"
      HOST: "0.0.0.0"
      PORT: "8000"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      ORCHESTRATOR_TOKEN: "${ORCHESTRATOR_TOKEN:?Set ORCHESTRATOR_TOKEN in .env}"
      MCP_BEARER_TOKEN: "${MCP_BEARER_TOKEN:-}"
      TAMANNA_BRIDGE_SERVICE_TOKEN: "${TAMANNA_BRIDGE_SERVICE_TOKEN:-}"
      BRIDGE_MAX_MESSAGE_CHARS: "${BRIDGE_MAX_MESSAGE_CHARS:-12000}"
      TAMANNA_PROTOCOL_REDIS_URL: "redis://protocol-redis:6379/0"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/reports.db}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tamanna-data:/app/data
    depends_on:
      protocol-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tamanna-internal

  tamanna-ai:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: deploy/tamanna-ai/Dockerfile
    container_name: tamanna-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      TAMANNA_ENV: "${TAMANNA_ENV:-production}"
      TAMANNA_MODEL_PROVIDER: "${TAMANNA_MODEL_PROVIDER:-ollama}"
      TAMANNA_OLLAMA_URL: "http://ollama:11434"
      TAMANNA_OLLAMA_MODEL: "${TAMANNA_OLLAMA_MODEL:-qwen2.5:7b}"
      TAMANNA_SESSION_SECRET: "${TAMANNA_SESSION_SECRET:-}"
      TAMANNA_ADMIN_EMAIL: "${TAMANNA_ADMIN_EMAIL:-}"
      TAMANNA_AUTH_DB: "/app/data/accounts.sqlite3"
      TAMANNA_DATABASE_URL: "sqlite:////app/data/tamanna.sqlite3"
      TAMANNA_MODEL_SETTINGS_PATH: "/app/data/model_settings.json"
      TAMANNA_CORS_ORIGINS: "${TAMANNA_CORS_ORIGINS:-https://www.bd-king-r7.com,https://bd-king-r7.com,https://tamanna456760-it.github.io}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - tamanna-ai-data:/app/data
    depends_on:
      ollama:
        condition: service_started
    networks:
      - tamanna-internal
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: tamanna-ollama
    restart: unless-stopped
    volumes:
      - tamanna-ollama-models:/root/.ollama
    networks:
      - tamanna-internal
    init: true
    security_opt:
      - no-new-privileges:true

  protocol-redis:
    image: redis:7.4-alpine
    container_name: tamanna-protocol-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tamanna-internal

  tor:
    build:
      context: .
      dockerfile: deploy/tor/Dockerfile
    container_name: tamanna-central-server-tor
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy
    volumes:
      - tamanna-tor-data:/var/lib/tor
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/tor/hidden_service/hostname"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tamanna-internal

networks:
  tamanna-internal:
    driver: bridge

volumes:
  tamanna-data:
  tamanna-ai-data:
  tamanna-ollama-models:
  tamanna-tor-data:
