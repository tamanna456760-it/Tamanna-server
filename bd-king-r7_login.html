<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Login</title>

<style>
  /* reset */
  * {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
  }

  /* body styles */
  body {
	height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
	background: linear-gradient(to bottom, #1b263b 20%, #415a77 100%);
	font-family: Arial, sans-serif;
  }

  /* login box */
  .loginBox {
	width: 350px;
	padding: 40px;
	background: linear-gradient(to top, #1b263b 20%, #415a77 100%);
	box-shadow: 0 10px 30px rgba(0,0,0,0.5);
	border-radius: 15px;
	border-top-left-radius: 60px;
	border-bottom-right-radius: 60px;
	color: #e0e0e0;
  }

  h2 {
	text-align: center;
	margin-bottom: 30px;
  }

  /* input fields */
  .inputGrp {
	margin-bottom: 20px;
  }
  .inputGrp label {
	display: block;
	margin-bottom: 5px;
	font-size: 15px;
	color: #a0c4ff;
  }
  .inputGrp input {
	width: 100%;
	padding: 12px;
	border-radius: 10px;
	border: 1.5px solid rgba(160,196,255,0.5);
	background: rgba(255,255,255,0.05);
	color: #e0e0e0;
	font-size: 17px;
	outline: none;
  }
  .inputGrp input:focus{
	border-color: #6a9fff;
	box-shadow: 0 0 8px rgba(106,159,255,0.4);
  }

  /* button */
  button {
	width: 100%;
	padding: 12px;
	border: none;
	border-radius: 10px;
	background: #6a9fff;
	font-weight: 600;
	cursor: pointer;
  }
  button:hover {
	background: #5a8ae6;
	cursor: not-allowed;
  }

  /* error message */
  .errMsg {
	margin-top: 15px;
	color: #ff6b6b;
	font-size: 15px;
	text-align: center;
  }
</style>
</head>

<body>

<div class="loginBox">
  <h2>Login</h2>

  <div class="inputGrp">
	<label for="user">Username</label>
	<input type="text" id="user" placeholder="username here">
  </div>

  <div class="inputGrp">
	<label for="pwd">Password</label>
	<input type="password" id="pwd" placeholder="password here">
  </div>

  <button id="btnLogin" type="button" disabled>Login unavailable</button>

  <div class="errMsg" id="errMsg"></div>
</div>

<script>
  // This legacy page has no server-side identity provider.
  // Keep it disabled rather than pretending client-side credentials are secure.
  document.getElementById("user").disabled = true;
  document.getElementById("pwd").disabled = true;
  document.getElementById("btnLogin").disabled = true;
  document.getElementById("errMsg").textContent =
    "Login is unavailable: connect a secure server-side authentication service first.";
</script>

</body>
</html>
